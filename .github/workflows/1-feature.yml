name: 1 - FEATURE BRANCHES

on:
  push:
    branches:
      - "feature/*"
  pull_request:
    branches:
      - "main"
      - "develop"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Set up Node.js for SCSS compilation
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Run pylint with the Django plugin so it understands models, views, etc.
      # DB_ENGINE=sqlite3 avoids connection attempts to external databases.
      # DEBUG=True + a dummy SECRET_KEY satisfy the settings.py security guards in CI.
      - name: Lint with pylint
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          DB_ENGINE: django.db.backends.sqlite3
          DEBUG: "True"
          SECRET_KEY: "ci-only-insecure-key-not-used-in-production"
        run: |
          python -m pylint --load-plugins=pylint_django \
                 --django-settings-module=core.settings \
                 $(git ls-files '*.py' | grep -v 'migrations/')

      # Run the test suite using SQLite so no external service is needed.
      # DEBUG=True + a dummy SECRET_KEY satisfy the settings.py security guards in CI.
      - name: Run tests
        env:
          DB_ENGINE: django.db.backends.sqlite3
          DEBUG: "True"
          SECRET_KEY: "ci-only-insecure-key-not-used-in-production"
          SQLITE_TEST_DB_PATH: ${{ runner.temp }}/legacypeople-tests.sqlite3
        run: |
          python manage.py test legacy_people --verbosity=2

  create-pr:
    needs: build
    runs-on: ubuntu-latest
    # Only open the PR on direct pushes to feature branches, not on PRs.
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if a PR already exists for this branch targeting develop
          pr_exists=$(gh pr list --head "${{ github.ref_name }}" --base develop --json number --jq '.[0].number')
          if [ -n "$pr_exists" ]; then
            echo "Pull request already exists: #$pr_exists"
          else
            echo "Creating pull request from ${{ github.ref_name }} to develop..."
            gh pr create \
              --title "Auto PR: ${{ github.ref_name }} to develop" \
              --body "This PR was automatically created by the **1 - FEATURE BRANCHES** workflow because all build, lint and test steps finished with success." \
              --base develop \
              --head "${{ github.ref_name }}"
          fi
