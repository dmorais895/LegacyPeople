name: Feature Branch CI

on:
  push:
    branches:
      - 'feature/**'

jobs:
  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create and Activate Virtual Environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pylint
        run: |
          source venv/bin/activate
          pylint --fail-under=10.0 core legacy_people

  test:
    name: Tests
    needs: pylint
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: legacypeople
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create and Activate Virtual Environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Database Migrations and Tests
        env:
          DB_NAME: legacypeople
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: |
          source venv/bin/activate
          python manage.py migrate
          python manage.py test

  create-pr:
    needs: test
    runs-on: ubuntu-latest
    # Only open the PR on direct pushes to feature branches, not on PRs.
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if a PR already exists for this branch targeting develop
          pr_exists=$(gh pr list --head "${{ github.ref_name }}" --base develop --json number --jq '.[0].number')
          if [ -n "$pr_exists" ]; then
            echo "Pull request already exists: #$pr_exists"
          else
            echo "Creating pull request from ${{ github.ref_name }} to develop..."
            gh pr create \
              --title "Auto PR: ${{ github.ref_name }} to develop" \
              --body "This PR was automatically created by the **1 - FEATURE BRANCHES** workflow because all build, lint and test steps finished with success." \
              --base develop \
              --head "${{ github.ref_name }}"
          fi
