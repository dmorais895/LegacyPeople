{% extends 'legacy_people/base.html' %}

{% block content %}
<div class="row justify-content-center pb-5">
    <div class="col-md-8 col-lg-7">
        <div class="glass-panel p-4 p-md-5">
            <h3 class="mb-4 text-center fw-bold text-glass">Formulário Legacy</h3>
            <form action="{% url 'legacy_people:main_form' %}" method="POST">
                {% csrf_token %}

                <div class="row">
                    <!-- Full Name -->
                    <div class="col-md-6 mb-4">
                        <label for="inputName" class="form-label fw-semibold text-glass-light">Nome Completo</label>
                        <input type="text" class="form-control glass-input" id="inputName" name="name" placeholder="Seu nome completo" required aria-required="true">
                    </div>

                    <!-- Email Address -->
                    <div class="col-md-6 mb-4">
                        <label for="inputEmail" class="form-label fw-semibold text-glass-light">Endereço de E-mail</label>
                        <input type="email" class="form-control glass-input" id="inputEmail" name="email" placeholder="nome@exemplo.com" required aria-required="true">
                    </div>
                </div>

                <!-- Whatsapp Number -->
                <div class="mb-4">
                    <label for="inputWhatsapp" class="form-label fw-semibold text-glass-light">Número de WhatsApp</label>
                    <input type="text" class="form-control glass-input" id="inputWhatsapp" name="whatsapp" placeholder="+55 XX X XXXX-XXXX" required aria-required="true">
                </div>

                <!-- Fix: radio group wrapped in fieldset/legend for screen readers -->
                <fieldset class="mb-4">
                    <legend class="form-label fw-semibold text-glass-light">Faz parte de um Grupo de Crescimento?</legend>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="has_gc" id="gcYes" value="yes" onchange="toggleGC()">
                        <label class="form-check-label text-glass-light" for="gcYes">Sim</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="has_gc" id="gcNo" value="no" onchange="toggleGC()" checked>
                        <label class="form-check-label text-glass-light" for="gcNo">Não</label>
                    </div>
                </fieldset>

                <!-- GC Name (Hidden by default) -->
                <div class="mb-4 d-none" id="gcNameDiv" aria-hidden="true">
                    <label for="inputGcName" class="form-label fw-semibold text-glass-light">Qual Grupo de Crescimento?</label>
                    <input type="text" class="form-control glass-input" id="inputGcName" name="gc_name" placeholder="Digite o nome ou líder do seu GC">
                </div>

                <!-- Fix: select instead of free text for quantifiable data analysis -->
                <div class="mb-4">
                    <label for="inputTime" class="form-label fw-semibold text-glass-light">A quanto tempo está em Lagoinha?</label>
                    <select class="form-control glass-input" id="inputTime" name="time_lagoinha" required aria-required="true">
                        <option value="" disabled selected>Selecione uma opção...</option>
                        <option value="menos_6_meses">Menos de 6 meses</option>
                        <option value="6_meses_1_ano">Entre 6 meses e 1 ano</option>
                        <option value="1_3_anos">Entre 1 e 3 anos</option>
                        <option value="mais_3_anos">Mais de 3 anos</option>
                    </select>
                </div>

                <!-- Fix: radio group wrapped in fieldset/legend -->
                <fieldset class="mb-4">
                    <legend class="form-label fw-semibold text-glass-light">Como você está se sentindo?</legend>
                    <div class="d-flex flex-wrap gap-3 mt-2">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="feeling" id="feeling1" value="1" required>
                            <label class="form-check-label text-glass-light" for="feeling1"><i class="bi bi-emoji-laughing me-1"></i> Ótimo</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="feeling" id="feeling2" value="2">
                            <label class="form-check-label text-glass-light" for="feeling2"><i class="bi bi-emoji-smile me-1"></i> Bem</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="feeling" id="feeling3" value="3">
                            <label class="form-check-label text-glass-light" for="feeling3"><i class="bi bi-emoji-neutral me-1"></i> Neutro</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="feeling" id="feeling4" value="4">
                            <label class="form-check-label text-glass-light" for="feeling4"><i class="bi bi-emoji-frown me-1"></i> Não muito bem</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="feeling" id="feeling5" value="5">
                            <label class="form-check-label text-glass-light" for="feeling5"><i class="bi bi-emoji-angry me-1"></i> Mal</label>
                        </div>
                    </div>
                </fieldset>

                <!-- Tem algum pedido de oração? -->
                <div class="mb-4">
                    <label for="inputPrayer" class="form-label fw-semibold text-glass-light">Tem algum pedido de oração?</label>
                    <textarea class="form-control glass-input" id="inputPrayer" name="prayer_request" rows="3" placeholder="Deixe seu pedido aqui para orarmos por você..."></textarea>
                </div>

                <!-- Fix: radio group wrapped in fieldset/legend -->
                <fieldset class="mb-4">
                    <legend class="form-label fw-semibold text-glass-light">Gostaria de conversar?</legend>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="wants_chat" id="chatYes" value="yes">
                        <label class="form-check-label text-glass-light" for="chatYes">Sim</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="wants_chat" id="chatNo" value="no" checked>
                        <label class="form-check-label text-glass-light" for="chatNo">Não</label>
                    </div>
                </fieldset>

                <!-- Fix: radio group wrapped in fieldset/legend -->
                <fieldset class="mb-4">
                    <legend class="form-label fw-semibold text-glass-light">Você frequenta o culto Legacy ou as nossas programações?</legend>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="frequents_legacy" id="legacyYes" value="yes" onchange="toggleLegacy()" checked>
                        <label class="form-check-label text-glass-light" for="legacyYes">Sim</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="frequents_legacy" id="legacyNo" value="no" onchange="toggleLegacy()">
                        <label class="form-check-label text-glass-light" for="legacyNo">Não</label>
                    </div>
                </fieldset>

                <!-- Hidden by default -->
                <div class="mb-5 d-none" id="legacyReasonDiv" aria-hidden="true">
                    <label for="inputLegacyReason" class="form-label fw-semibold text-glass-light">O que te faria se interessar mais pelo ministério?</label>
                    <textarea class="form-control glass-input" id="inputLegacyReason" name="legacy_reason" rows="3" placeholder="Sua opinião é muito importante para nós. O que podemos melhorar?"></textarea>
                </div>

                <button type="submit" class="btn btn-glass w-100 text-uppercase fw-bold">Enviar Respostas</button>
            </form>
        </div>
    </div>
</div>

<script>
    // Fix: use aria-hidden toggle alongside d-none for screen reader support
    function toggleGC() {
        const yesRadio = document.getElementById('gcYes');
        const gcNameDiv = document.getElementById('gcNameDiv');
        const isVisible = yesRadio.checked;
        gcNameDiv.classList.toggle('d-none', !isVisible);
        gcNameDiv.setAttribute('aria-hidden', String(!isVisible));
        if (!isVisible) {
            document.getElementById('inputGcName').value = '';
        }
    }

    function toggleLegacy() {
        const noRadio = document.getElementById('legacyNo');
        const legacyReasonDiv = document.getElementById('legacyReasonDiv');
        const isVisible = noRadio.checked;
        legacyReasonDiv.classList.toggle('d-none', !isVisible);
        legacyReasonDiv.setAttribute('aria-hidden', String(!isVisible));
        if (!isVisible) {
            document.getElementById('inputLegacyReason').value = '';
        }
    }
</script>
{% endblock %}
