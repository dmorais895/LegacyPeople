{% extends 'legacy_people/base.html' %}

{% block content %}
<div class="row justify-content-center pt-4 pb-5">
    <div class="col-md-6 col-lg-5">
        <div class="glass-panel p-4 p-md-5">
            <h3 class="mb-4 text-center fw-bold text-glass">Acesso Administrativo</h3>
            <form method="POST" action="{% url 'legacy_people:login' %}">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="id_username" class="form-label fw-semibold text-glass-light">Usuário</label>
                    <input type="text" name="username" class="form-control glass-input" id="id_username" placeholder="Digite seu usuário" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="id_password" class="form-label fw-semibold text-glass-light">Senha</label>
                    <input type="password" name="password" class="form-control glass-input" id="id_password" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="btn btn-glass w-100 text-uppercase fw-bold mt-2">Entrar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
