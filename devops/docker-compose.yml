services:
  app:
    build:
      context: ..
      dockerfile: devops/Dockerfile
    container_name: legacypeople_app
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # -----------------------------------------------------------------------
      # Django — Security settings
      # SECRET_KEY is required. Set it in your .env file.
      # DEBUG=True enables the development server and relaxed ALLOWED_HOSTS.
      # -----------------------------------------------------------------------
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      # -----------------------------------------------------------------------
      # Database — MySQL connection
      # -----------------------------------------------------------------------
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=${DB_NAME:-legacypeople}
      - DB_USER=${DB_USER:-django}
      - DB_PASSWORD=${DB_PASSWORD:-django}
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: legacypeople_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-legacypeople}
      MYSQL_USER: ${DB_USER:-django}
      MYSQL_PASSWORD: ${DB_PASSWORD:-django}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
